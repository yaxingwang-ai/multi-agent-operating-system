name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/v1.2-multi-agent-workflow]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # constraints.txt was generated on Python 3.14, so CI uses the same version.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install MAOS and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt

      - name: Check CLI versions
        run: |
          maos-research --version
          maos-workflow --version

      # The tests are offline: no API key, no network (see tests/conftest.py).
      - name: Run tests
        run: python -m pytest
